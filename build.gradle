plugins {
    id 'javafx-gradle-plugin' version '0.0.13'
    id 'application'
}

dependencies {
    implementation 'org.openjfx:javafx-controls:23.0.1'
    implementation 'org.openjfx:javafx-fxml:23.0.1'
    // 其他需要的JavaFX模块
}

javafx {
    version = "23.0.1"
    modules = [ 'javafx.controls', 'javafx.fxml' ] // 添加您需要的模块
}


application {
    mainClass = 'Main' // 替换为您的主类
}